name: Test SFTP

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test SFTP connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILLY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/silly_key
          chmod 600 ~/.ssh/silly_key

          sftp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -P 2022 \
            -i ~/.ssh/silly_key \
            usobaiev.8fca0402@node1.sillydev.co.uk << 'EOF'
          pwd
          ls
          bye
          EOF
