name: Deploy FlashLearn

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload files to Silly Development
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILLY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/silly_key
          chmod 600 ~/.ssh/silly_key

          sftp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -i ~/.ssh/silly_key \
            -P 2022 \
            usobaiev.8fca0402@node1.sillydev.co.uk << 'EOF'
          put main.py main.py
          put database.py database.py
          put words.json words.json
          put requirements.txt requirements.txt
          put Procfile Procfile
          bye
          EOF

      - name: Test Silly Development API
        env:
          SILLY_API_KEY: ${{ secrets.SILLY_API_KEY }}
        run: |
          curl -i \
            -H "Authorization: Bearer $SILLY_API_KEY" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" \
            "https://sillydev.co.uk/api/client/servers/8fca0402"
