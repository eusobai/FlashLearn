name: Test SSH

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILLY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/silly_key
          chmod 600 ~/.ssh/silly_key

          ssh-keygen -y -f ~/.ssh/silly_key > /dev/null

          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -p 2022 \
              -i ~/.ssh/silly_key \
              usobaiev.8fca0402@node1.sillydev.co.uk \
              "echo SSH_OK"
