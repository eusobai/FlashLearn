name: Test SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload files to Silly Development
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILLY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/silly_key
          chmod 600 ~/.ssh/silly_key

          sftp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -i ~/.ssh/silly_key \
            -P 2022 \
            usobaiev.8fca0402@node1.sillydev.co.uk << 'EOF'
          put main.py /home/container/main.py
          put database.py /home/container/database.py
          put words.json /home/container/words.json
          put requirements.txt /home/container/requirements.txt
          put Procfile /home/container/Procfile
          bye
          EOF
